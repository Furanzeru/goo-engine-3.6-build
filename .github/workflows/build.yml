- name: Setup Python
  uses: actions/setup-python@v5
  with:
    python-version: "3.10"

- name: Install dependencies
  shell: cmd
  run: |
    choco install -y cmake ninja git 7zip svn

- name: Verify Python & SVN
  shell: cmd
  run: |
    python --version
    svn --version

- name: Cache Blender lib folder
  uses: actions/cache@v3
  with:
    path: lib/win64_vc15
    key: ${{ runner.os }}-libs-${{ hashFiles('**/GNUmakefile') }}
    restore-keys: |
      ${{ runner.os }}-libs-

- name: Update libraries with retry
  shell: cmd
  run: |
    set RETRIES=3
    :loop
    call make.bat update || (
      if "%RETRIES%"=="0" exit /b 1
      set /a RETRIES-=1
      echo "Retrying make.bat update, remaining: %RETRIES%"
      goto loop
    )

- name: Build Goo Engine
  shell: cmd
  run: |
    call make.bat -j %NUMBER_OF_PROCESSORS%