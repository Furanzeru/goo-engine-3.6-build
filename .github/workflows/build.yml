name: Build Goo Engine (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - goo-engine-v3.6-release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Goo Engine
        uses: actions/checkout@v3
        with:
          ref: goo-engine-v3.6-release

      - name: Install required packages (choco)
        # run in cmd so choco works as expected
        shell: cmd
        run: |
          choco install -y cmake ninja git python make 7zip

      - name: Verify tools
        shell: cmd
        run: |
          cmake --version
          ninja --version
          git --version
          python --version

      - name: Update libraries (Windows)
        # run the repo's Windows helper
        shell: cmd
        run: |
          call make.bat update

      - name: Build Goo Engine (Windows)
        shell: cmd
        run: |
          call make.bat -j %NUMBER_OF_PROCESSORS%

      - name: Upload Windows artifact (full Release folder)
        uses: actions/upload-artifact@v4
        with:
          name: GooEngine-Windows
          path: build_windows/bin/Release/**